<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Conexão Google Calendar - Onav</title>
    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --bg: #f4f7f9;
            --card: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            padding: 40px;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
            color: #111;
            font-size: 24px;
        }

        .section {
            margin-bottom: 25px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        #create-btn {
            background: var(--success);
        }

        .result {
            padding: 15px;
            border-radius: 6px;
            margin-top: 20px;
            display: none;
        }

        .result.success {
            background: #d4edda;
            color: #155724;
            display: block;
        }

        .result.error {
            background: #f8d7da;
            color: #721c24;
            display: block;
        }

        .log {
            background: #222;
            color: #0f0;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            margin-top: 20px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Google Calendar Test</h1>

        <!-- Section 1: Check Availability -->
        <div class="section">
            <h3>1. Verificar Disponibilidade</h3>
            <label>Data de Início</label>
            <input type="date" id="check-start">
            <label>Data de Fim (Opcional)</label>
            <input type="date" id="check-end">
            <button id="check-btn">Verificar via API</button>
        </div>

        <!-- Section 2: Create Test Event -->
        <div class="section">
            <h3>2. Criar Evento de Teste</h3>
            <label>Título do Evento</label>
            <input type="text" id="event-title" placeholder="Ex: Reserva Teste Onav">
            <label>Data</label>
            <input type="date" id="event-date">
            <button id="create-btn">Criar Evento na Agenda</button>
        </div>

        <div id="result-box" class="result"></div>
        <div id="debug-log" class="log" style="display:none;"></div>
    </div>

    <script>
        const resultBox = document.getElementById('result-box');
        const debugLog = document.getElementById('debug-log');

        function showResult(msg, isError = false) {
            resultBox.textContent = msg;
            resultBox.className = 'result ' + (isError ? 'error' : 'success');
        }

        function log(msg) {
            debugLog.style.display = 'block';
            debugLog.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            debugLog.scrollTop = debugLog.scrollHeight;
        }

        // --- CHECK AVAILABILITY ---
        document.getElementById('check-btn').onclick = async () => {
            const startDate = document.getElementById('check-start').value;
            const endDate = document.getElementById('check-end').value;

            if (!startDate) return alert('Selecione uma data');

            log(`Iniciando checagem para: ${startDate}...`);
            try {
                const res = await fetch('/api/check-availability', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ startDate, endDate })
                });
                const data = await res.json();

                if (data.available) {
                    showResult('✅ DATA DISPONÍVEL! Nenhum conflito encontrado.');
                    log('Resultado: Disponível');
                } else {
                    showResult('❌ DATA OCUPADA. Existem eventos na agenda.', true);
                    log('Resultado: Ocupado. Slots: ' + JSON.stringify(data.busySlots));
                }
            } catch (e) {
                showResult('Erro ao conectar com o servidor.', true);
                log('ERRO: ' + e.message);
            }
        };

        // --- CREATE EVENT ---
        document.getElementById('create-btn').onclick = async () => {
            const title = document.getElementById('event-title').value || 'Reserva Teste Onav';
            const date = document.getElementById('event-date').value;

            if (!date) return alert('Selecione uma data para o evento');

            log(`Tentando criar evento: "${title}" em ${date}...`);
            try {
                const res = await fetch('/api/test-create-event', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, date })
                });
                const data = await res.json();

                if (res.ok) {
                    showResult(`✅ SUCESSO! Evento criado. ID: ${data.id}`);
                    log('Evento criado com sucesso na agenda.');
                } else {
                    showResult('❌ FALHA ao criar evento: ' + (data.error || 'Erro desconhecido'), true);
                    log('ERRO DA API: ' + JSON.stringify(data));
                }
            } catch (e) {
                showResult('Erro ao enviar pedido.', true);
                log('ERRO: ' + e.message);
            }
        };
    </script>
</body>

</html>
