<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhas Propostas - LED Wall</title>
  
  <!-- Authentication modules -->
  <script src="auth-config.js" defer></script>
  <script src="auth.js" defer></script>
  <script src="auth-ui.js" defer></script>
  <script src="auth-protection.js" defer></script>
  <script src="quote-service.js" defer></script>
  <script src="webhook-service.js" defer></script>
  <script src="discount-calculator.js" defer></script>
  <script src="my-quotes.js" defer></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root {
      --bg-gradient-start: #01040c;
      --bg-gradient-end: #0b1222;
      --accent-color: #fbbf24;
      --accent-strong: #f97316;
      --panel-bg: rgba(7, 12, 24, 0.96);
      --card-bg: rgba(13, 20, 36, 0.96);
      --card-border: rgba(248, 250, 252, 0.08);
      --panel-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      --text-primary: #f8fafc;
      --text-muted: #cdd6f6;
      --danger: #f87171;
      --success: #34d399;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at 20% 20%, rgba(249, 115, 22, 0.22), transparent 45%),
        radial-gradient(circle at 80% 0%, rgba(251, 191, 36, 0.18), transparent 35%),
        linear-gradient(135deg, var(--bg-gradient-start), var(--bg-gradient-end));
      color: var(--text-primary);
      padding: 40px 20px 80px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: linear-gradient(120deg, rgba(255, 255, 255, 0.05), transparent 60%);
      mix-blend-mode: screen;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px clamp(18px, 4vw, 48px);
      background: var(--panel-bg);
      border: 1px solid var(--card-border);
      border-radius: 28px;
      box-shadow: var(--panel-shadow);
      backdrop-filter: blur(18px);
    }

    .header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .header h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      color: var(--text-primary);
      letter-spacing: 0.5px;
    }

    .back-button {
      padding: 12px 20px;
      border-radius: 999px;
      background: linear-gradient(120deg, var(--accent-strong), var(--accent-color));
      color: #0f172a;
      font-weight: 600;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(249, 115, 22, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .back-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(249, 115, 22, 0.45);
    }

    .auth-nav-buttons {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .auth-button {
      border: none;
      border-radius: 999px;
      padding: 8px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(120deg, var(--accent-strong), var(--accent-color));
      box-shadow: 0 10px 22px rgba(249, 115, 22, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .auth-button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 30px rgba(249, 115, 22, 0.45);
    }

    .logout-btn {
      background: linear-gradient(120deg, #f87171, #ef4444);
      color: #fff;
      box-shadow: 0 10px 24px rgba(239, 68, 68, 0.35);
    }

    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #user-name {
      color: var(--text-primary);
      font-weight: 600;
      max-width: 220px;
      white-space: normal;
      line-height: 1.2;
    }

    #quotes-list {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .quote-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 22px 45px rgba(5, 10, 20, 0.55);
      backdrop-filter: blur(12px);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .quote-card:hover {
      transform: translateY(-4px);
      border-color: rgba(249, 115, 22, 0.5);
      box-shadow: 0 30px 60px rgba(5, 10, 20, 0.7);
    }

    .quote-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .quote-header h3 {
      margin: 0;
      font-size: 1.25rem;
      color: var(--text-primary);
    }

    .quote-date {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .quote-details {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
    }

    .quote-info p {
      margin: 6px 0;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .quote-info strong {
      color: var(--text-primary);
    }

    .quote-price {
      text-align: right;
      min-width: 220px;
    }

    .price {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-color);
      margin: 6px 0;
    }

    .view-details-btn {
      border: none;
      border-radius: 12px;
      padding: 10px 18px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      color: #0f172a;
      background: linear-gradient(120deg, var(--accent-strong), var(--accent-color));
      box-shadow: 0 10px 24px rgba(249, 115, 22, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .view-details-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 36px rgba(249, 115, 22, 0.45);
    }

    .loading, .empty-quotes, .error, .login-prompt {
      text-align: center;
      padding: 32px;
      border-radius: 22px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-primary);
      box-shadow: 0 18px 40px rgba(5, 10, 20, 0.55);
    }

    .loading { color: #60a5fa; }
    .empty-quotes { color: var(--text-muted); }
    .error { color: var(--danger); }

    .login-button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      border-radius: 999px;
      font-weight: 600;
      text-decoration: none;
      color: #0f172a;
      background: linear-gradient(120deg, var(--accent-strong), var(--accent-color));
      box-shadow: 0 10px 24px rgba(249, 115, 22, 0.35);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #0b1222;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      width: min(860px, 95vw);
      max-height: 90vh;
      overflow-y: auto;
      padding: 36px;
      position: relative;
      box-shadow: 0 35px 60px rgba(0, 0, 0, 0.7);
      color: var(--text-primary);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      font-size: 1.8rem;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
    }

    .quote-details-section,
    .quote-detail-section {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .quote-detail-section h3,
    .quote-details-section h3 {
      color: var(--accent-color);
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .quote-detail-section h4 {
      margin: 0 0 10px;
      color: var(--text-primary);
    }

    .quote-detail-section p,
    .quote-details-section p {
      margin: 6px 0;
      color: var(--text-muted);
    }

    .service-item {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .service-header {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .service-header h4 {
      margin: 0;
      color: var(--text-primary);
    }

    .service-detail-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .total-section {
      background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.3);
      border-radius: 14px;
      padding: 18px;
      margin-top: 20px;
    }

    .total-section h3 {
      margin: 0 0 10px;
      color: var(--success);
    }

    .total-price {
      font-size: 1.5rem;
      color: var(--success);
      font-weight: 700;
    }

    @media (max-width: 768px) {
      body {
        padding: 20px 12px 60px;
      }

      .auth-nav-buttons {
        position: static;
        margin-bottom: 16px;
        width: 100%;
        justify-content: center;
      }

      .quote-details {
        flex-direction: column;
        text-align: left;
      }

      .quote-price {
        text-align: left;
      }

      .modal-content {
        padding: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="container" id="quotes-container">
    <div class="header">
      <h1>Minhas Propostas</h1>
      <a href="index.html" class="back-button">Voltar ao Calculador</a>
    </div>
    
    <div id="quotes-list">
      <!-- Quotes will be loaded here -->
    </div>
  </div>

  <!-- Initialize authentication -->
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      console.log('[my-quotes.html] DOM loaded, initializing authentication...');
      
      // Check if auth module is available
      const waitForAuth = () => {
        return new Promise((resolve) => {
          let attempts = 0;
          const maxAttempts = 20;
          
          const checkAuth = () => {
            if (window.auth) {
              console.log('[my-quotes.html] Auth module found');
              resolve();
            } else {
              attempts++;
              if (attempts >= maxAttempts) {
                console.error('[my-quotes.html] Auth module not found after maximum attempts');
                resolve(); // Resolve anyway to prevent hanging
                return;
              }
              console.log(`[my-quotes.html] Waiting for auth to be available... (${attempts}/${maxAttempts})`);
              setTimeout(checkAuth, 500);
            }
          };
          checkAuth();
        });
      };

      // Initialize authentication
      waitForAuth()
        .then(async () => {
          if (window.auth) {
            console.log('[my-quotes.html] Initializing auth...');
            await window.auth.initAuth();
            console.log('[my-quotes.html] Auth initialized');
          }
          
          // Initialize authentication UI
          if (window.authUI) {
            window.authUI.initAuthUI();
            console.log('[my-quotes.html] Authentication UI initialized');
          } else {
            console.error('[my-quotes.html] Auth UI module not available');
          }
        })
        .catch(error => {
          console.error('[my-quotes.html] Failed to initialize authentication:', error);
        });
    });
  </script>
</body>
</html>
